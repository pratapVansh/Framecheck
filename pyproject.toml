[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "product-image-inspector"
version = "0.4.0"
description = "Explainable DIP inspection of e-commerce product images"
requires-python = ">=3.12"
dependencies = [
  "opencv-python-headless>=4.11,<6",
  "numpy>=2.2,<3",
  "Pillow>=11,<13",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "websockets>=15,<16"]
submission = ["python-pptx==1.0.2"]
garment = ["torch==2.13.0", "transformers==5.13.1", "safetensors==0.8.0"]

[tool.setuptools.packages.find]
include = ["inspector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
